# Проверки описательного анализа и эксперимента CatBoost.

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/catboost/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Базовые проверки ошибок, а не массовое переформатирование исторических расчётов.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# CLI may be run by file path; source root is installed on sys.path first.
"experiments/catboost/run_experiments.py" = ["E402"]
